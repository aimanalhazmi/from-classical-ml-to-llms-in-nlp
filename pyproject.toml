[project]
name = "from-classical-ml-to-llms-in-nlp"
version = "0.1.0"
description = "A comparative analysis of NLP evolution, evaluating multilingual transfer in medical contexts and benchmarking LLMs against classical machine learning on structured data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.5.0",
    "evaluate>=0.4.6",
    "jupyterlab>=4.5.3",
    "nltk>=3.9.2",
    "numpy>=2.4.1",
    "openai>=2.17.0",
    "pandas>=3.0.0",
    "peft>=0.18.1",
    "rich>=14.3.1",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "spacy>=3.8.11",
    "torch>=2.10.0",
    "tqdm>=4.67.1",
    "transformers>=5.0.0",
    "wordcloud>=1.9.6",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
main = "main:main"

[tool.mypy]
check_untyped_defs = true
explicit_package_bases = true
warn_unreachable = true
warn_redundant_casts = true

# Performance optimizations
cache_fine_grained = true
incremental = true
sqlite_cache = true
follow_imports = "skip"


[tool.ruff]
line-length = 150
target-version = "py312"


[tool.ruff.lint]
select = [
    "F",    # Pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]
ignore = [
    "E501",  # Long lines
    "E731"   # lambda vs. def
]

[tool.vulture]
paths = ["src"]
exclude = [".tmp"]
min_confidence = 80
